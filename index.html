function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=S.cfg.rate;speechSynthesis.speak(u);}
function say(t,force,key){if(!t||(!S.cfg.narr&&!force))return;if(key&&S.cfg.useVoz!==false&&playVoz(key,t))return;speak(t);}
function fmt(n){const c=S.cfg.cur;if(c==0)return n+' '+JT().e;if(c==1)return (n*10)+' pontos';if(c==2)return n+' 🪙';return 'R$ '+(n*0.5).toFixed(2).replace('.',',');}
function fmtSay(n){const c=S.cfg.cur;if(c==0)return n+' '+(n==1?JT().one:JT().many);if(c==1)return (n*10)+' pontos';if(c==2)return n+(n==1?' moeda':' moedas');return (n*0.5).toFixed(2).replace('.',',')+' reais';}
const T=id=>S.tasks.find(t=>t.id===id);
const sortT=l=>l.slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
function parseSteps(v){return v.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(' ');const f=i>0?l.slice(0,i):'';if(f&&!/[A-Za-zÀ-ÿ0-9]/.test(f))return{icon:f,text:l.slice(i+1).trim()||'Fazer'};return{icon:'🔹',text:l};});}

function prof(area){return S.cfg.dlg[area]||S.cfg.dlg.g;}
function stepSay(t){const p=prof(t.area),st=t.steps[S.step],n=t.steps.length;
 if(p==='passo')return 'Passo '+(S.step+1)+' de '+n+'. '+st.text+'. '+(S.step<n-1?'Quando terminar, toque em Próximo.':'Quando terminar, toque em Concluí.');
 if(p==='moderado')return st.text+'.';
 return '';}
function doneSay(t,auto){const p=prof(t.area);
 if(p==='passo')return 'Muito bem! Você concluiu '+t.name+'. '+(auto?'Você ganhou '+fmtSay(t.reward)+'.':'Seus pais vão ver e liberar o que você ganhou.');
 if(p==='moderado')return 'Muito bem!';
 return 'Pronto!';}
function alarmSay(t){const p=prof(t.area);
 if(p==='passo')return 'Está na hora de '+t.name+'. Vamos começar? Toque em Vamos.';

function bump(){S.week.done=Math.min(S.week.total,S.week.done+1);if(S.week.done>=S.week.total&&!S.week.counted){S.week.counted=true;S.month.done=Math.min(S.month.weeks,S.month.done+1);}}
let AC=null;
function chime(n){if(!S.cfg.play.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const notes=n===2?[523,659,784]:[659,523];notes.forEach(function(f,i){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;const t0=AC.currentTime+i*0.3;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(S.cfg.play.vol,t0+0.05);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.7);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+0.75);});}catch(e){}}
function mmss(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function endSay(){const p=S.cfg.dlg.g;if(p==='passo')return 'O tempo de brincar acabou. Foi muito bom! Vamos voltar?';if(p==='moderado')return 'O tempo de brincar acabou.';return '';}
function startPlay(){const m=S.play.ready;if(!m)return;S.play={ready:0,running:true,ended:false,left:m*60,total:m*60,warned:{}};S.kid='play';chime(1);render();say(S.cfg.dlg.g==='objetivo'?'':'Pode ir brincar. Guarde o celular no bolso. Eu aviso quando estiver acabando.',0,'play_start');}
function playTick(){const p=S.play;if(!p.running)return;p.left-=S.cfg.play.demo?30:1;const w=[];if(S.cfg.play.warn5)w.push(5);if(S.cfg.play.warn1)w.push(1);
 w.forEach(function(m){if(p.left<=m*60&&p.left>0&&!p.warned[m]&&p.total>m*60){p.warned[m]=true;chime(1);say(warnSay(m),0,'warn'+m);}});

function next(){const t=T(S.cur);if(S.step<t.steps.length-1){S.step++;render();say(stepSay(t));}else finish();}
function finish(){const t=T(S.cur);if(t.proof&&t.proof!=='none'&&!S.proofOk){S.kid='proof';S.proofMsg='';render();say(proofSay(t));return;}S.proofOk=false;finishNow();}
function finishNow(){const t=T(S.cur);const auto=S.cfg.auto[t.area]>=3;if(auto){t.state='done';S.balance+=t.reward;bump();}else{t.state='wait';S.pending.push({type:'tarefa',id:t.id});}if(S.lock===t.id)S.lock=null;S.kid='done';render();say(doneSay(t,auto));}
function trigger(id){const t=T(id);if(!t||t.state!=='todo')return;S.view='kid';S.kid='alarm';S.alarm=id;if(t.block)S.lock=id;render();window.scrollTo(0,0);say(alarmSay(t));}
function snooze(){const t=T(S.alarm);S.alarm=null;S.kid='home';render();say(t&&prof(t.area)==='passo'?'Tudo bem. Eu aviso de novo daqui a cinco minutos.':'');}
function redeem(id){const r=S.rewards.find(x=>x.id===id);if(S.balance<r.cost)return;S.balance-=r.cost;if(r.tela&&S.cfg.auto.tela>=3){S.said='Liberado! Aproveite 📺';}else{S.pending.push({type:'troca',id:r.id});S.said='Pedido enviado aos pais 💛';}render();say(S.said.replace(/[^\p{L}\p{N}\s!,.]/gu,''));}
function speakPhrase(p){S.said=p;render();say(p,true);}
function approve(i){const p=S.pending[i];if(p.type==='tarefa')provaDel(p.id);if(p.type==='tarefa'){const t=T(p.id);t.state='done';S.balance+=t.reward;bump();}S.pending.splice(i,1);render();}
function decline(i){const p=S.pending[i];if(p.type==='tarefa')provaDel(p.id);if(p.type==='tarefa'){T(p.id).state='todo';}else{S.balance+=S.rewards.find(x=>x.id===p.id).cost;}S.pending.splice(i,1);render();}
function setCfg(k,v){S.cfg[k]=v;render();}
function setDlg(k,v){S.cfg.dlg[k]=v;render();}
function setAuto(a,l){S.cfg.auto[a]=l;render();}
function upd(id,k,v){const t=T(id);if(k==='reward')t.reward=Math.max(0,Number(v)||0);else if(k==='steps')t.steps=parseSteps(v);else t[k]=v;render();}
function addTask(){S.tasks.push({id:++nid,icon:'⭐',name:'Nova atividade',area:'casa',time:'',block:false,reward:1,state:'todo',steps:[{icon:'🔹',text:'Fazer a atividade'}]});render();}
function addLib(i){const l=LIB[i];S.tasks.push({id:++nid,icon:l.icon,name:l.name,area:l.area,time:'',block:false,reward:1,state:'todo',steps:l.steps.map(s=>({icon:s[0],text:s[1]}))});render();}
function delTask(id){S.tasks=S.tasks.filter(t=>t.id!==id);if(S.lock===id)S.lock=null;render();}
function addAviso(){const i=$('#avIcon').value.trim()||'📢',t=$('#avText').value.trim();if(!t)return;S.avisos.push({icon:i,text:t});render();}
function delAviso(i){S.avisos.splice(i,1);render();}
function setWeek(k,v){if(k==='total')S.week.total=Math.max(3,Math.min(20,Number(v)||9));else S.week[k]=v;S.week.done=Math.min(S.week.done,S.week.total);render();}
function sugg(id,ok){const s=S.sugg.find(x=>x.id===id);s.s=ok?'aceita':'depois';if(ok){if(id===1)S.cfg.auto.rotina=2;if(id===2)S.cfg.fadeLast=true;}render();}
function resetDay(){S.play={ready:S.cfg.play.min,running:false,ended:false,left:0,total:0,warned:{}};S.tasks.forEach(t=>t.state='todo');S.pending=S.pending.filter(p=>p.type!=='tarefa');S.lock=null;S.fired={};render();}
function resetWeek(){S.week.done=0;S.week.counted=false;render();}

function topbar(){return `<div class="top"><button class="${S.view==='kid'?'on':''}" onclick="setView('kid')">👧 Visão dela</button><button class="${S.view==='par'?'on':''}" onclick="setView('par')">👨‍👩‍👧 Visão dos pais</button></div><div class="ribbon">Laboratório v0.6 · fica salvo neste aparelho · a IA aqui é simulada</div>`;}

function kidNav(){const n=[['home','🏠','Meu dia'],['casa','🧹','Casa'],['escola','🎒','Escola'],['talk','💬','Falar'],['store','🎁','Loja'],['calm','🌿','Calma']];return `<div class="nav">${n.map(x=>`<button class="${S.kid===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`;}

function taskCard(t){return `<div class="task ${t.state}" onclick="startTask(${t.id})"><div class="ic">${esc(t.icon)}</div><div class="grow"><div class="nm">${esc(t.name)}</div>${t.time?`<span class="chip">⏰ ${esc(t.time)}</span>`:''}<span class="tag ${t.state}">${t.state==='todo'?'▶ Vamos! +'+fmt(t.reward):t.state==='wait'?'⏳ Os pais vão ver':'✓ Feito'}</span></div><button class="spk" onclick="event.stopPropagation();say(${q(t.name)},1)">🔊</button></div>`;}

function lockBanner(){if(!S.lock)return '';const t=T(S.lock);return `<div class="lockbox"><div class="pair"><div class="b">${esc(t.icon)}<small>Primeiro</small></div><div class="ar">➜</div><div class="b">📱<small>Depois</small></div></div><p style="text-align:center;font-weight:700;margin:6px 0 0">A tela de lazer volta quando você terminar: ${esc(t.name)}</p></div>`;}

function puz(){const w=S.week,open=w.done>=w.total,n=Math.round(w.done/w.total*9);
 const sayT=open?'Parabéns! Você ganhou: '+w.name+'.':'Sua meta da semana é '+w.name+'. Você já abriu '+w.done+' de '+w.total+' pedaços.';
 return `<div class="card"><div class="row"><div class="puz">${esc(w.gift)}<div class="cv">${Array.from({length:9},(_,i)=>`<i class="${i<n?'open':''}"></i>`).join('')}</div></div><div class="grow"><h3>Meta da semana</h3><p style="font-weight:800;font-size:18px;margin:2px 0">${open?'🎁 Presente liberado!':esc(w.name)}</p><p class="muted">${open?esc(w.name):'Cada atividade abre um pedaço: '+w.done+' de '+w.total+'.'}</p></div><button class="spk" onclick="say(${q(sayT)},1)">🔊</button></div></div>`;}

function monthCard(){const m=S.month,open=m.done>=m.weeks;const sayT=open?'Parabéns! Você ganhou o '+m.name+' do mês.':'Sua meta do mês é '+m.name+'. Você já completou '+m.done+' de '+m.weeks+' semanas.';
 return `<div class="card"><div class="row"><div style="font-size:44px">${esc(m.gift)}</div><div class="grow"><h3>Meta do mês</h3><p style="font-weight:800;margin:2px 0">${open?'🎉 '+esc(m.name)+' liberado!':esc(m.name)}</p><div class="slots">${Array.from({length:m.weeks},(_,i)=>`<span class="${i<m.done?'on':''}">⭐</span>`).join('')}</div></div><button class="spk" onclick="say(${q(sayT)},1)">🔊</button></div></div>`;}

function playCard(){const p=S.play;
 if(p.running)return `<div class="card row"><div style="font-size:40px">🌳</div><div class="grow"><b>Brincando lá fora</b><div style="font-size:24px;font-weight:800">${mmss(p.left)}</div></div><button class="btn small" onclick="go('play')">Ver</button></div>`;
 if(p.ready)return `<div class="card row"><div style="font-size:40px">🌳</div><div class="grow"><b>Hora de brincar</b><div class="muted">${p.ready} minutos · fora do celular</div></div><button class="btn small ok" onclick="startPlay()">Começar</button></div>`;
 return '';}

function kidPlay(){const p=S.play;const pct=p.total?Math.round(p.left/p.total*100):0;
 if(p.ended){const nx=sortT(S.tasks.filter(t=>t.state==='todo'))[0];return `<div class="pad" style="text-align:center"><div style="font-size:90px;margin-top:20px">🌙</div><h1>O tempo de brincar acabou</h1><p style="font-size:19px">Foi muito bom brincar! 🙂 Vamos voltar?</p><button class="spk" style="width:60px;height:60px;font-size:28px" onclick="say(${q('O tempo de brincar acabou. Foi muito bom! Vamos voltar?')},1)">🔊</button>${nx?`<h2>Próxima atividade</h2>${taskCard(nx)}`:''}<button class="btn" style="margin-top:10px" onclick="S.play.ended=false;go('home')">Voltar ao meu dia</button></div>`;}
 if(p.running)return `<div class="pad" style="text-align:center"><div style="font-size:70px;margin-top:10px">🌳</div><h1>Hora de brincar lá fora</h1><div class="clock">${mmss(p.left)}</div><div class="bar"><i style="width:${pct}%"></i></div><p class="muted">Pode guardar o celular no bolso. Eu aviso com um sonzinho antes de acabar.</p><button class="btn sec" onclick="stopPlay()">Terminar agora</button></div>`;
 return `<div class="pad" style="text-align:center"><div style="font-size:70px;margin-top:20px">🌳</div><h1>Sem tempo de brincar agora</h1><p class="muted">Os pais liberam o próximo tempo de brincar.</p><button class="btn" onclick="go('home')">Voltar ao meu dia</button></div>`;}

function kidHome(){const open=S.tasks.filter(t=>t.state==='todo').length;const stars=Math.min(S.balance,12);const pct=Math.min(S.balance/10,1)*100;
 const greet='Bom dia! Hoje temos '+open+(open==1?' coisa':' coisas')+' para fazer. Você já tem '+fmtSay(S.balance)+'.';
 return `<div class="pad"><div class="row"><h1 class="grow">Bom dia! ☀️</h1><button class="spk" onclick="say(${q(greet)},1)">🔊</button></div>
 ${lockBanner()}
 ${S.cfg.agent.on?agentBar(agGreet(open),'ok'):''}
 <div class="card jar"><div class="jarbox"><div class="jarfill" style="height:${pct}%"></div><div class="jarstars">${JT().e.repeat(stars)}</div></div><div><h3>Meu pote</h3><div style="font-size:26px;font-weight:800">${fmt(S.balance)}</div><p class="muted">Faça as atividades para encher o pote.</p>${S.cfg.jarKid?`<button class="btn sec small" style="width:auto" onclick="nextJar()">${JT().e} Trocar o pote</button>`:''}</div></div>
 ${puz()}
 ${monthCard()}${playCard()}<h2>O que vamos fazer hoje</h2>${sortT(S.tasks).map(taskCard).join('')}</div>`;}

function kidArea(area,title,intro){const l=sortT(S.tasks.filter(t=>t.area===area));
 return `<div class="pad"><div class="row"><h1 class="grow">${title}</h1><button class="spk" onclick="say(${q(intro)},1)">🔊</button></div>${lockBanner()}
 ${area==='escola'?`<h2>Avisos da escola</h2>${S.avisos.length?S.avisos.map(a=>`<div class="card row"><div style="font-size:40px">${esc(a.icon)}</div><div class="grow" style="font-weight:700">${esc(a.text)}</div><button class="spk" onclick="say(${q(a.text)},1)">🔊</button></div>`).join(''):'<div class="card muted">Sem avisos por enquanto.</div>'}<h2>Minhas atividades</h2>`:''}
 ${l.length?l.map(taskCard).join(''):'<div class="card muted">Nenhuma atividade aqui ainda.</div>'}</div>`;}

function kidTask(){const t=T(S.cur),st=t.steps[S.step],last=S.step===t.steps.length-1;const showArrow=S.cfg.arrows&&!(S.cfg.fadeLast&&last);const p=prof(t.area);
 return `<div class="pad"><div class="row"><button class="spk" onclick="go('home')">⬅️</button><div class="grow dots">${t.steps.map((_,i)=>`<i class="${i<S.step?'on':i===S.step?'cur':''}"></i>`).join('')}</div></div>
 ${p==='passo'?`<div class="muted" style="text-align:center;font-weight:700">Passo ${S.step+1} de ${t.steps.length}</div>`:''}
 <div class="stage"><div class="big ${S.cfg.outline?'ring':''}">${esc(st.icon)}</div><div class="steptxt">${esc(st.text)}</div><div style="margin-top:14px"><button class="spk" style="width:60px;height:60px;font-size:28px" onclick="say(${q(st.text)},1)">🔊</button></div></div>
 ${showArrow?'<div class="arrow">⬇️</div>':'<div style="height:52px"></div>'}
 <button class="btn ${last?'ok':''}" onclick="next()">${last?'Concluí! ✅':'Próximo ➜'}</button></div>`;}

function kidAlarm(){const t=T(S.alarm);if(!t)return kidHome();
 return `<div class="pad alarm"><div style="font-size:30px;margin-top:10px">⏰ ${esc(t.time||'')}</div><div class="stage"><div class="big ${S.cfg.outline?'ring':''}">${esc(t.icon)}</div><h1>Hora de ${esc(t.name.toLowerCase())}</h1><div style="margin-top:12px"><button class="spk" style="width:60px;height:60px;font-size:28px" onclick="say(${q(alarmSay(t))},1)">🔊</button></div></div>
 ${t.block?`<div class="lockbox"><div class="pair"><div class="b">${esc(t.icon)}<small>Primeiro</small></div><div class="ar">➜</div><div class="b">📱<small>Depois</small></div></div></div>`:''}
 <button class="btn" onclick="startTask(${t.id})">Vamos! ▶</button>
 <div class="row" style="margin-top:10px"><button class="btn sec small grow" onclick="snooze()">Daqui a 5 minutos</button><button class="btn sec small grow" onclick="go('talk')">💬 Quero falar</button></div></div>`;}

function kidDone(){const t=T(S.cur);return `<div class="pad" style="text-align:center"><div style="font-size:110px;margin-top:30px">🎉</div><h1>Muito bem!</h1>${S.cfg.agent.on?agentBar('Parabéns'+(S.cfg.nick?', '+S.cfg.nick:'')+'! Você foi muito bem!','joy'):''}<p style="font-size:20px">${t.state==='done'?'Você ganhou <b>'+fmt(t.reward)+'</b>':'Seus pais vão ver e liberar 💛'}</p>${S.lock===null&&t.block?'<p style="font-weight:700">📱 A tela voltou!</p>':''}<div class="stage"><div class="big">${esc(t.icon)}</div></div><button class="btn" onclick="go('home')">Voltar ao meu dia</button></div>`;}

function kidStore(){
 if(S.lock){const t=T(S.lock);return `<div class="pad"><h1>Loja 🎁</h1>${lockBanner()}<div class="card" style="text-align:center"><div style="font-size:70px">${esc(t.icon)}</div><p style="font-size:20px;font-weight:800">A loja abre depois de: ${esc(t.name)}</p><button class="btn" onclick="startTask(${t.id})">Vamos fazer agora ▶</button></div></div>`;}
 return `<div class="pad"><div class="row"><h1 class="grow">Loja 🎁</h1><div style="font-weight:800;font-size:20px">${fmt(S.balance)}</div></div>${S.said?`<div class="speakbar">${esc(S.said)}</div>`:''}<p class="muted">Troque o que você ganhou por coisas legais.</p>
 <div class="grid">${S.rewards.map(r=>`<div class="tile" style="cursor:default"><span class="e">${r.icon}</span>${esc(r.name)}<div style="margin:8px 0;color:var(--pri-d)">${fmt(r.cost)}</div><button class="btn small" ${S.balance<r.cost?'disabled':''} onclick="S.said='';redeem(${r.id})">Trocar</button></div>`).join('')}</div></div>`;}

function kidTalk(){return `<div class="pad"><h1>Quero falar 💬</h1><p class="muted">Toque e o celular fala por você. Está sempre liberado.</p>${S.said?`<div class="speakbar">${esc(S.said)}</div>`:''}<div class="grid">${talk.map(x=>`<div class="tile" onclick="speakPhrase(${q(x[1])})"><span class="e">${x[0]}</span>${x[1]}</div>`).join('')}</div></div>`;}

function kidCalm(){return `<div class="pad" style="text-align:center"><h1>Calma 🌿</h1>${S.cfg.agent.on?agentBar('Estou aqui com você. Vamos respirar juntos.','calm'):''}<p style="font-size:20px">Puxe o ar devagar... e solte.</p><div class="breath">🌿</div><button class="btn sec" onclick="go('home')">Voltar</button></div>`;}

function kidView(){const m={home:kidHome,casa:()=>kidArea('casa','Casa 🏠','Aqui estão as atividades de casa.'),escola:()=>kidArea('escola','Escola 🎒','Aqui estão os avisos e as atividades da escola.'),task:kidTask,alarm:kidAlarm,done:kidDone,store:kidStore,talk:kidTalk,calm:kidCalm,play:kidPlay,avatar:kidAvatar,proof:kidProof,checkin:kidCheckin};return m[S.kid]()+(['task','done','alarm','proof','checkin','avatar'].includes(S.kid)?'':kidNav());}

function parTabs(){const n=[['hoje','📋','Hoje'],['ajustes','⚙️','Ajustes'],['agente','🤖','Agente']];return `<div class="nav">${n.map(x=>`<button class="${S.pTab===x[0]?'on':''}" onclick="S.pTab='${x[0]}';render();window.scrollTo(0,0)"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`;}

function parHoje(){const done=S.tasks.filter(t=>t.state==='done').length;
 return `<div class="pad"><h1>Painel dos pais</h1>
 <div class="stat"><div class="card"><b>${done}/${S.tasks.length}</b><span class="muted">feitas hoje</span></div><div class="card"><b>${fmt(S.balance)}</b><span class="muted">no pote</span></div></div>
 ${S.lock?`<div class="lockbox"><b>📱 Tela de lazer em pausa</b> até ela concluir "${esc(T(S.lock).name)}".<p><button class="btn sec small" onclick="S.lock=null;render()">Liberar a tela agora</button></p></div>`:''}
 <h2>Aguardando vocês ${S.pending.length?'('+S.pending.length+')':''}</h2>
 ${S.pending.length?S.pending.map((p,i)=>{const it=p.type==='tarefa'?T(p.id):S.rewards.find(x=>x.id===p.id);return `<div class="card"><div class="row"><div style="font-size:36px">${esc(it.icon)}</div><div class="grow"><h3>${p.type==='tarefa'?'Concluiu: ':'Quer trocar: '}${esc(it.name)}</h3><span class="muted">${p.type==='tarefa'?'Libera '+fmt(it.reward):'Custa '+fmt(it.cost)}</span></div></div>${p.type==='tarefa'?proofPrev(p.id):''}<div class="row" style="margin-top:10px"><button class="btn ok small grow" onclick="approve(${i})">Aprovar 💛</button><button class="btn sec small grow" onclick="decline(${i})">Hoje não</button></div></div>`}).join(''):'<div class="card muted">Nada pendente. Na visão dela, conclua uma atividade para ver o fluxo.</div>'}
 ${ciList()}
 <h2>Próximos lembretes</h2>${sortT(S.tasks.filter(t=>t.time)).map(t=>`<div class="card row"><div style="font-size:30px">${esc(t.icon)}</div><div class="grow"><b>${esc(t.time)}</b> · ${esc(t.name)}${t.block?' <span class="muted">· tela em pausa até concluir</span>':''}</div><button class="btn sec small" onclick="trigger(${t.id})">Testar</button></div>`).join('')||'<div class="card muted">Nenhuma atividade com horário.</div>'}
 <p class="muted">O lembrete toca sozinho no horário enquanto esta página estiver aberta na visão dela. Com o app instalado, ele chegaria com o celular bloqueado.</p>
 <h2>Meta da semana</h2><div class="card"><p>${esc(S.week.gift)} <b>${esc(S.week.name)}</b>: ${S.week.done} de ${S.week.total} pedaços.</p><p>${esc(S.month.gift)} <b>${esc(S.month.name)}</b> do mês: ${S.month.done} de ${S.month.weeks} semanas.</p><button class="btn sec small" onclick="resetWeek()">↺ Reiniciar a semana</button></div>
 <h2>Carta da semana (exemplo)</h2><div class="card"><p>🌟 <b>Vitórias:</b> a rotina da manhã foi concluída em 5 de 7 dias.</p><p>🌱 <b>Em crescimento:</b> o passo "enxaguar a boca" ainda pede a seta.</p><p>💡 <b>Para esta semana:</b> elogiar com palavras específicas, perto da hora da conquista.</p></div>
 <button class="btn sec" onclick="resetDay()">↺ Reiniciar o dia (demonstração)</button></div>`;}

function dlgSel(k){const v=S.cfg.dlg[k];return `<select onchange="setDlg('${k}',this.value)"><option value="" ${v===''?'selected':''}>Seguir o geral</option>${Object.keys(DLG).map(x=>`<option value="${x}" ${v===x?'selected':''}>${DLG[x]}</option>`).join('')}</select>`;}

function parAjustes(){const c=S.cfg;
 const sw=(k,l)=>`<label class="sw">${l}<input type="checkbox" ${c[k]?'checked':''} onchange="setCfg('${k}',this.checked)"></label>`;
 return `<div class="pad"><h1>Ajustes</h1><p class="muted">Tudo aqui é editável e muda a visão dela na hora.</p>
 <h2>Perfil de diálogo</h2><div class="card"><p class="muted">Como o app conversa com ela. Vale para todos os módulos, e cada um pode ter o seu.</p>
 <div class="seg">${Object.keys(DLG).map(x=>`<button class="${c.dlg.g===x?'on':''}" onclick="setDlg('g','${x}')">${DLG[x]}</button>`).join('')}</div>
 <p class="muted">${DLGD[c.dlg.g]}</p>
 <p class="muted">Por módulo:</p>
 <label class="sw">Rotina ${dlgSel('rotina')}</label><label class="sw">Casa ${dlgSel('casa')}</label><label class="sw">Escola ${dlgSel('escola')}</label>
 <p class="muted">Ouvir exemplo ("Colocar pasta nos dentes"):</p><div class="seg">${Object.keys(DLG).map(x=>`<button onclick="say(${q(DLGX[x])},1)">🔊 ${DLG[x]}</button>`).join('')}</div></div>
 <h2>Apoios didáticos</h2><div class="card">${sw('narr','🔊 Narração em áudio automática')}${sw('arrows','⬇️ Setas indicando o próximo passo')}${sw('outline','🟡 Contorno destacando a ilustração')}${sw('fadeLast','Retirar a seta no último passo')}${sw('still','Menos movimento (sensibilidade sensorial)')}
 <label class="sw">Velocidade da voz<select onchange="setCfg('rate',Number(this.value))"><option value="0.7" ${c.rate==0.7?'selected':''}>Lenta</option><option value="0.9" ${c.rate==0.9?'selected':''}>Normal</option><option value="1.1" ${c.rate==1.1?'selected':''}>Rápida</option></select></label></div>
 <h2>Valor da conquista</h2><div class="card"><p class="muted">Escolha o degrau que ela compreende hoje.</p><div class="seg">${CUR.map((x,i)=>`<button class="${c.cur===i?'on':''}" onclick="setCfg('cur',${i})">${x}</button>`).join('')}</div><p class="muted">Exemplo: "Escovar os dentes" vale ${fmt(1)}.</p></div>

function joCard(){return `<h2>Pote de conquistas</h2><div class="card"><p class="muted">Muda só o desenho e o som. O valor é o mesmo: uma conquista vale um item. Vale quando a unidade de valor é o pote com tema.</p>

/* salvar no aparelho */
const KEY='apoio_v05',PERSIST=['balance','week','month','cfg','tasks','avisos','rewards','pending','sugg','fired','play','checkins'];
let lastSave=0;
function save(){lastSave=Date.now();try{const o={day:new Date().toDateString()};PERSIST.forEach(k=>o[k]=S[k]);localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function mergeCfg(d,s){const r=Object.assign({},d);for(const k in s){r[k]=(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&d[k]&&typeof d[k]==='object')?Object.assign({},d[k],s[k]):s[k];}return r;}
function applyState(o,newDay){PERSIST.forEach(k=>{if(o[k]!==undefined)S[k]=(k==='cfg')?mergeCfg(S.cfg,o.cfg):o[k];});
 S.play.running=false;S.play.ended=false;
 nid=Math.max(nid,...S.tasks.map(t=>t.id||0))+1;
 if(newDay){S.tasks.forEach(t=>t.state='todo');S.pending=S.pending.filter(p=>p.type!=='tarefa');S.fired={};S.lock=null;S.play={ready:S.cfg.play.min,running:false,ended:false,left:0,total:0,warned:{}};}}

function expCode(){const o={};PERSIST.forEach(k=>o[k]=S[k]);return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function bkGen(){const c=expCode();S.bk=c;S.bkMsg='Código gerado. Copie e guarde, ou mande para o outro aparelho.';try{navigator.clipboard.writeText(c).then(function(){S.bkMsg='Código copiado. Cole no outro aparelho em "Importar".';render();}).catch(function(){S.bkMsg='Não consegui copiar sozinho. Selecione o código na caixa e copie.';render();});}catch(e){}render();}

const VF=[{k:'play_start',t:'Pode ir brincar. Guarde o celular no bolso. Eu aviso quando estiver acabando.'},{k:'warn5',t:'Faltam 5 minutos para terminar de brincar.'},{k:'warn1',t:'Falta 1 minuto para terminar.'},{k:'play_end',t:'O tempo de brincar acabou. Foi muito bom! Vamos voltar?'}];
const VOZ={};let idb=null,REC=null,CUR_AUDIO=null;
function idbOpen(){return new Promise(function(res){try{const r=indexedDB.open('apoio-voz',2);r.onupgradeneeded=function(){const d=r.result;if(!d.objectStoreNames.contains('voz'))d.createObjectStore('voz');if(!d.objectStoreNames.contains('prova'))d.createObjectStore('prova');};r.onsuccess=function(){idb=r.result;res(idb);};r.onerror=function(){res(null);};}catch(e){res(null);}});}
function vozLoadAll(){idbOpen().then(function(db){if(!db)return;try{const rq=db.transaction('voz').objectStore('voz').openCursor();rq.onsuccess=function(){const c=rq.result;if(c){VOZ[c.key]=c.value;c.continue();}else provaLoadAll(db);};}catch(e){}});}
function vozPut(k,v){VOZ[k]=v;if(!idb)return;try{idb.transaction('voz','readwrite').objectStore('voz').put(v,k);}catch(e){}}
function vozDel(k){delete VOZ[k];if(idb){try{idb.transaction('voz','readwrite').objectStore('voz').delete(k);}catch(e){}}render();}
function playVoz(k,fallbackText){const v=VOZ[k];if(!v)return false;try{if(CUR_AUDIO){CUR_AUDIO.pause();}if('speechSynthesis' in window)speechSynthesis.cancel();const a=new Audio(URL.createObjectURL(new Blob([v.buf],{type:v.type})));CUR_AUDIO=a;const p=a.play();if(p&&p.catch)p.catch(function(){if(fallbackText)speak(fallbackText);});return true;}catch(e){return false;}}
function vozRec(k){if(REC){recStop();return;}
 if(!navigator.mediaDevices||!window.MediaRecorder){S.vozMsg='Este aparelho não grava áudio por aqui.';render();return;}
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){const ch=[];const mr=new MediaRecorder(st);REC={k:k,mr:mr,st:st};
  mr.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data);};
  mr.onstop=function(){st.getTracks().forEach(t=>t.stop());const type=mr.mimeType||'audio/mp4';const b=new Blob(ch,{type:type});b.arrayBuffer().then(function(buf){vozPut(k,{buf:buf,type:type});REC=null;S.vozMsg='Gravado. Toque em ▶ para ouvir.';render();});};
  mr.start();S.vozMsg='Gravando... fale perto do microfone e toque em ⏹ para parar.';render();}).catch(function(){S.vozMsg='Sem permissão para o microfone. Libere nas permissões do navegador.';render();});}
function recStop(){if(REC&&REC.mr&&REC.mr.state!=='inactive')REC.mr.stop();}
function vozCard(){return `<h2>Voz dos pais</h2><div class="card"><p class="muted">Grave as frases com a sua voz. Quando existir gravação, o app usa a sua voz. Sem gravação, usa a voz do aparelho.</p>

 ${VF.map(f=>`<div class="card" style="margin:8px 0"><p style="margin:0 0 6px">${esc(f.t)}</p><div class="row">
  <button class="btn small ${REC&&REC.k===f.k?'':'sec'}" style="width:auto" onclick="vozRec('${f.k}')">${REC&&REC.k===f.k?'⏹ Parar':'🎙️ Gravar'}</button>
  ${VOZ[f.k]?`<button class="btn sec small" style="width:auto" onclick="playVoz('${f.k}')">▶ Ouvir</button><button class="btn sec small" style="width:auto" onclick="vozDel('${f.k}')">🗑️</button><span class="muted">gravado</span>`:'<span class="muted">sem gravação</span>'}</div></div>`).join('')}
 ${S.vozMsg?`<p class="muted">${esc(S.vozMsg)}</p>`:''}</div>`;}

const LVN={1:'Infantil',2:'Intermediário',3:'Realista'};
function avById(id){return AV.find(a=>a.id===id)||AV[0];}
function agName(){return (S.cfg.agent&&S.cfg.agent.name)||'Seu parceiro';}
function agGreet(open){return 'Oi'+(S.cfg.nick?', '+S.cfg.nick:'')+'! Hoje temos '+open+(open==1?' coisa':' coisas')+' para fazer. Eu estou com você.';}
function agentBar(msg,mood){const a=avById(S.cfg.agent.av);const col={ok:'#22a06b',joy:'#ffb703',calm:'#4aa3ff'}[mood||'ok'];
 return `<div class="card" style="border:3px solid ${col}"><div class="row"><div class="agav" ${S.cfg.agent.kidPick?'onclick="go(\'avatar\')" style="cursor:pointer"':''}>${a.svg}</div><div class="grow"><b>${esc(agName())}</b><div class="bubble">${esc(msg)}</div></div><button class="spk" onclick="say(${q(msg)},1)">🔊</button></div></div>`;}
function kidAvatar(){const lv=S.cfg.agent.levels;return `<div class="pad"><div class="row"><button class="spk" onclick="go('home')">⬅️</button><h1 class="grow">Quem é seu parceiro?</h1></div><div class="avgrid">${AV.filter(a=>lv[a.l]).map(a=>`<button class="${S.cfg.agent.av===a.id?'on':''}" onclick="setAv('${a.id}',1)">${a.svg}<div>${esc(a.n)}</div></button>`).join('')}</div></div>`;}
function setAv(id,kid){S.cfg.agent.av=id;if(kid)S.kid='home';render();if(kid)say('Esse é o meu parceiro!');}
function agCard(){const a=S.cfg.agent;return `<h2>Parceiro (agente)</h2><div class="card"><p class="muted">O parceiro conversa com ela na tela. Escolham o estilo, o nome e como ela participa.</p>
 <label class="sw">Mostrar o parceiro<input type="checkbox" ${a.on?'checked':''} onchange="S.cfg.agent.on=this.checked;render()"></label>
 <p class="muted">Nome do parceiro (ainda sem nome definido)</p><input type="text" value="${esc(a.name)}" placeholder="o nome que ela escolher" onchange="S.cfg.agent.name=this.value;render()">
 <p class="muted">Apelido dela, para o parceiro chamar (fica só neste aparelho)</p><input type="text" value="${esc(S.cfg.nick||'')}" onchange="S.cfg.nick=this.value;render()">
 <p class="muted">Estilos que ela pode ver</p><div class="seg">${[1,2,3].map(l=>`<button class="${a.levels[l]?'on':''}" onclick="S.cfg.agent.levels[${l}]=!S.cfg.agent.levels[${l}];render()">${LVN[l]}</button>`).join('')}</div>
 <div class="avgrid">${AV.filter(x=>a.levels[x.l]).map(x=>`<button class="${a.av===x.id?'on':''}" onclick="setAv('${x.id}')">${x.svg}<div>${esc(x.n)}</div></button>`).join('')}</div>
 <label class="sw">Ela pode trocar o parceiro<input type="checkbox" ${a.kidPick?'checked':''} onchange="S.cfg.agent.kidPick=this.checked;render()"></label></div>`;}
/* provas */
const VPROVA={},PURL={};
function provaPut(k,v){VPROVA[k]=v;if(idb){try{idb.transaction('prova','readwrite').objectStore('prova').put(v,k);}catch(e){}}}
function provaDel(k){delete VPROVA[k];if(PURL[k]){try{URL.revokeObjectURL(PURL[k]);}catch(e){}delete PURL[k];}if(idb){try{idb.transaction('prova','readwrite').objectStore('prova').delete(k);}catch(e){}}}
function provaUrl(k){const v=VPROVA[k];if(!v)return '';if(!PURL[k])PURL[k]=URL.createObjectURL(new Blob([v.buf],{type:v.type}));return PURL[k];}
function provaLoadAll(db){try{const rq=db.transaction('prova').objectStore('prova').openCursor();const lim=Date.now()-7*864e5;rq.onsuccess=function(){const c=rq.result;if(c){if(c.value&&c.value.ts&&c.value.ts<lim){try{db.transaction('prova','readwrite').objectStore('prova').delete(c.key);}catch(e){}}else VPROVA[c.key]=c.value;c.continue();}else render();};}catch(e){}}
function proofSay(t){return t.proof==='foto'?'Tire uma foto do que você fez.':t.proof==='video'?'Grave um vídeo curtinho do que você fez.':'Me conte em áudio o que você fez.';}
function kidProof(){const t=T(S.cur),k=t.proof;
 return `<div class="pad" style="text-align:center"><div style="font-size:80px;margin-top:10px">${k==='foto'?'📸':k==='video'?'🎥':'🎙️'}</div><h1>Mostre o que você fez</h1><p style="font-size:19px">${esc(proofSay(t))}</p>
 ${k==='audio'?`<button class="btn" onclick="proofRec()">${MR?'⏹ Parar e enviar':'🎙️ Gravar'}</button>`:`<label class="btn" style="display:block;cursor:pointer">${k==='foto'?'📸 Tirar foto':'🎥 Gravar vídeo'}<input id="pfile" type="file" accept="${k==='foto'?'image/*':'video/*'}" capture="environment" style="display:none" onchange="proofFile(this)"></label>`}
 ${S.proofMsg?`<p class="muted">${esc(S.proofMsg)}</p>`:''}<p></p><button class="btn sec" onclick="S.proofOk=true;finish()">Agora não consigo</button></div>`;}
function shrink(file,cb){const img=new Image(),u=URL.createObjectURL(file);img.onload=function(){const r=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);cb(b||file);},'image/jpeg',0.7);};img.onerror=function(){cb(file);};img.src=u;}
function proofFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const t=T(S.cur);
 const done=function(blob){blob.arrayBuffer().then(function(buf){provaPut(t.id,{buf:buf,type:blob.type||f.type,kind:t.proof,ts:Date.now()});S.proofOk=true;finish();});};
 if(t.proof==='foto')shrink(f,done);else{if(f.size>40*1024*1024){S.proofMsg='Vídeo muito grande. Grave um mais curto.';render();return;}done(f);}}
let MR=null;
function miniRec(onDone){if(MR){try{MR.mr.stop();}catch(e){}return;}
 if(!navigator.mediaDevices||!window.MediaRecorder){S.proofMsg='Este aparelho não grava áudio por aqui.';render();return;}
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){const ch=[],mr=new MediaRecorder(st);MR={mr:mr};mr.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data);};
  mr.onstop=function(){st.getTracks().forEach(function(t){t.stop();});const type=mr.mimeType||'audio/mp4';MR=null;new Blob(ch,{type:type}).arrayBuffer().then(function(buf){onDone({buf:buf,type:type});});};mr.start();render();}).catch(function(){S.proofMsg='Sem permissão para o microfone.';render();});}
function proofRec(){miniRec(function(v){const t=T(S.cur);provaPut(t.id,Object.assign(v,{kind:'audio',ts:Date.now()}));S.proofOk=true;finish();});}
function proofPrev(id){const t=T(id),v=VPROVA[id];if(!v)return (t.proof&&t.proof!=='none')?'<p class="muted">Sem prova enviada.</p>':'';const u=provaUrl(id);
 return `<div style="margin-top:8px">${v.kind==='foto'?`<img src="${u}" style="max-width:100%;border-radius:14px">`:v.kind==='video'?`<video src="${u}" controls playsinline style="max-width:100%;border-radius:14px"></video>`:`<audio src="${u}" controls></audio>`}<p class="muted">A prova é apagada do aparelho quando vocês decidirem.</p></div>`;}
/* check-in */
const CI_OPTS=[{e:'🎮',t:'Brincando',q:'O que você está brincando?'},{e:'📺',t:'Assistindo',q:'O que você está assistindo?'},{e:'📚',t:'Estudando',q:'O que você está estudando?'},{e:'🍽️',t:'Comendo',q:'O que você está comendo?'},{e:'😴',t:'Descansando',q:'Está tudo bem? Quer descansar mais um pouco?'},{e:'💬',t:'Outra coisa',q:'Me conta o que você está fazendo?'}];
function startCheckin(){S.view='kid';S.kid='checkin';S.ci={step:0};S.proofMsg='';render();window.scrollTo(0,0);say('Oi'+(S.cfg.nick?', '+S.cfg.nick:'')+'! O que você está fazendo agora?');}
function kidCheckin(){const c=S.ci||{step:0};
 if(c.step===0)return `<div class="pad">${S.cfg.agent.on?agentBar('O que você está fazendo agora?','ok'):'<h1>O que você está fazendo?</h1>'}<div class="grid">${CI_OPTS.map((o,i)=>`<div class="tile" onclick="ciPick(${i})"><span class="e">${o.e}</span>${o.t}</div>`).join('')}</div><p></p><button class="btn sec" onclick="go('home')">Depois</button></div>`;
 const o=CI_OPTS[c.opt];return `<div class="pad">${S.cfg.agent.on?agentBar(o.q,'ok'):'<h1>'+esc(o.q)+'</h1>'}<div style="text-align:center;font-size:70px">${o.e}</div>
 <button class="btn sec" onclick="ciAudio()">${MR?'⏹ Parar e enviar':'🎙️ Responder em áudio'}</button>${c.audio?'<p class="muted" style="text-align:center">Áudio enviado. Obrigada!</p>':''}${S.proofMsg&&!c.audio?`<p class="muted">${esc(S.proofMsg)}</p>`:''}<p></p><button class="btn" onclick="ciDone()">Pronto</button></div>`;}
function ciPick(i){S.ci={step:1,opt:i,ts:Date.now()};S.proofMsg='';render();say(CI_OPTS[i].q);}
function ciAudio(){miniRec(function(v){provaPut('ci-'+S.ci.ts,Object.assign(v,{kind:'audio',ts:S.ci.ts}));S.ci.audio=true;render();});}
function ciDone(){const o=CI_OPTS[S.ci.opt];S.checkins.push({ts:S.ci.ts,e:o.e,t:o.t,audio:!!S.ci.audio});S.checkins=S.checkins.slice(-30);S.kid='home';S.proofMsg='';render();say('Obrigada por me contar!');}
function ciList(){const d0=new Date().toDateString();const l=(S.checkins||[]).filter(c=>new Date(c.ts).toDateString()===d0).reverse();
 return `<h2>Check-ins de hoje</h2>${l.length?l.map(c=>`<div class="card"><b>${new Date(c.ts).toTimeString().slice(0,5)}</b> · ${c.e} ${esc(c.t)}${c.audio&&VPROVA['ci-'+c.ts]?`<div><audio src="${provaUrl('ci-'+c.ts)}" controls></audio></div>`:''}</div>`).join(''):'<div class="card muted">Nenhum check-in hoje.</div>'}`;}
function ciCard(){const c=S.cfg.check;return `<h2>Check-in com o parceiro</h2><div class="card"><p class="muted">Em horários que vocês escolhem, o parceiro pergunta o que ela está fazendo. Ela toca numa opção e pode responder em áudio. Não é cobrança: ela pode tocar em "Depois". Só funciona com o app aberto.</p>
 <label class="sw">Ligar os check-ins<input type="checkbox" ${c.on?'checked':''} onchange="S.cfg.check.on=this.checked;render()"></label>
 <p class="muted">Horários (separe por vírgula, ex.: 15:30, 18:00)</p><input type="text" value="${esc((c.times||[]).join(', '))}" onchange="setCiTimes(this.value)">
 <p><button class="btn sec small" onclick="S.unl=false;startCheckin()">Testar agora na visão dela</button></p></div>`;}
function setCiTimes(v){S.cfg.check.times=v.split(',').map(function(s){return s.trim();}).filter(function(s){return /^\d{2}:\d{2}$/.test(s);});render();}
function ciTick(){const c=S.cfg.check;if(!c||!c.on||S.view!=='kid'||['task','proof','checkin','play'].indexOf(S.kid)>=0)return;const d=new Date(),hm=d.toTimeString().slice(0,5),key=d.toDateString();(c.times||[]).forEach(function(t){if(t===hm&&S.ciFired[t]!==key){S.ciFired[t]=key;startCheckin();}});}
setInterval(ciTick,15000);

load();vozLoadAll();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
render();
setInterval(function(){const d=new Date();const hm=d.toTimeString().slice(0,5),key=d.toDateString();S.tasks.forEach(function(t){if(t.time===hm&&t.state==='todo'&&S.fired[t.id]!==key&&S.view==='kid'&&S.kid!=='task'){S.fired[t.id]=key;trigger(t.id);}});},15000);
setInterval(playTick,1000);
</script>
</body>
</html>
